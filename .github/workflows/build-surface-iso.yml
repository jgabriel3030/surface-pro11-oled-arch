name: Build Surface Pro 11 ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build on native ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out custom toolkit
        uses: actions/checkout@v4

      - name: Run safety and reproducibility tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Stage exactly locked upstream source
        run: |
          python3 -B toolkit.py prepare --output work/sp11-staged
          python3 -B toolkit.py verify --staged work/sp11-staged

      - name: Resolve builder tag to immutable digest
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          docker pull ironrobin/archports-aarch64:latest
          BUILDER=$(docker image inspect --format '{{index .RepoDigests 0}}' ironrobin/archports-aarch64:latest)
          [[ "$BUILDER" =~ ^ironrobin/archports-aarch64@sha256:[[:xdigit:]]{64}$ ]]
          echo "ref=$BUILDER" >> "$GITHUB_OUTPUT"

      - name: Build custom Surface ISO (no disk installation)
        run: |
          python3 -B toolkit.py build --staged work/sp11-staged \
            --container-image '${{ steps.builder.outputs.ref }}' --execute

      - name: Upload ISO and provenance
        uses: actions/upload-artifact@v4
        with:
          name: surface-pro11-oled-aarch64-cachy-style-v2
          path: |
            work/sp11-staged/out/*.iso
            work/sp11-staged/build-receipt.json
            work/sp11-staged/toolkit-manifest.json
          if-no-files-found: error
          compression-level: 0
